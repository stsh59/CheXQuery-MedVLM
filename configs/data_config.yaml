# ============================================
# CheXQuery-MedVLM Data Configuration
# ============================================
# Adapted for MIMIC-CXR dataset (local copy).

# Dataset
dataset:
  name: "mimic_cxr"
  # Local path to the MIMIC-CXR dataset directory
  data_root: "mimic-cxr-dataset"
  # Relative paths inside data_root
  images_dir: "official_data_iccv_final/files"
  reports_dir: "mimic-cxr-reports/files"
  metadata_csv: "metadata.csv"
  # Balanced subset CSV produced by `python main.py balance`
  balanced_csv: "outputs/mimic_cxr_balanced.csv"

# Balanced sampling parameters (used by `python main.py balance`)
balanced_sampling:
  target_total: 10000           # Target number of studies in subset
  min_per_condition: 500        # Minimum positive studies per rare condition
  max_per_condition: 1500       # Cap for common disease conditions
  max_no_finding: 1500          # Cap for No Finding-only studies
  max_support_devices: 1500     # Cap for Support Devices-dominant studies

# Data splits
splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_by: "patient"  # Split by patient (subject_id) to avoid data leakage
  split_file: "outputs/splits/data_splits.json"

# Image preprocessing
image:
  size: 384
  channels: 3  # Original X-rays are grayscale, converted to RGB for SigLIP
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  use_siglip_processor: true
  processor_model: "google/siglip-base-patch16-384"

# Data augmentation (medically-valid for chest X-rays)
# IMPORTANT: Augmentations are conservative to preserve diagnostic validity
augmentation:
  # NOT USED - would corrupt anatomy:
  #   - horizontal_flip: Heart is on LEFT side, flipping is invalid
  #   - vertical_flip: Would invert patient orientation
  #   - large rotations: Patients are positioned consistently
  # 
  # USED (conservative):
  rotation_degrees: 5        # Small rotation for positioning variance
  translate_percent: 0.03    # Small translation for centering variance  
  scale_range: [0.97, 1.03]  # Minimal scaling for distance variance
  brightness_jitter: 0.05    # Conservative intensity change
  contrast_jitter: 0.05      # Conservative contrast change

# Text preprocessing
text:
  max_length: 512
  structured_format: true
  output_template: "Findings: {findings} | Impression: {impression}"
  
  # Prompt template for generation
  prompt_template: |
    Generate a structured radiology report for this chest X-ray image.
    Format: Findings: [detailed observations] | Impression: [clinical conclusion]
    Report:

# CheXbert labels
chexbert:
  num_labels: 14
  labels:
    - "No Finding"
    - "Enlarged Cardiomediastinum"
    - "Cardiomegaly"
    - "Lung Opacity"
    - "Lung Lesion"
    - "Edema"
    - "Consolidation"
    - "Pneumonia"
    - "Atelectasis"
    - "Pneumothorax"
    - "Pleural Effusion"
    - "Pleural Other"
    - "Fracture"
    - "Support Devices"

# Filtering
filtering:
  # Canonical projection type used by the dataset / datamodule
  projection_type: "Frontal"
  # Multi-view support (set require_both_views to true to enable)
  projection_types: ["Frontal", "Lateral"]
  require_both_views: false    # Frontal-only maximizes data availability
  min_report_length: 10        # Minimum characters in report
  require_impression: true     # Require non-empty impression
  # ViewPosition -> canonical category mapping (MIMIC-CXR specific)
  view_position_map:
    PA: "Frontal"
    AP: "Frontal"
    LATERAL: "Lateral"
    LL: "Lateral"

# Sampling strategy for training dataloader.
# "condition_aware" weights each sample by the rarity of its rarest
# positive CheXbert condition, so rare diseases are sampled more
# frequently.  With the balanced MIMIC-CXR subset this is less
# extreme than with IU X-ray, but still beneficial.
sampling:
  enable: true
  strategy: "condition_aware"   # "condition_aware" or "binary"
  abnormal_ratio: 0.5           # Only used when strategy="binary"
