# ============================================
# CheXQuery-MedVLM Training Configuration
# ============================================

# General
seed: 42
output_dir: "outputs"
checkpoint_dir: "outputs/checkpoints"
log_dir: "outputs/logs"

# Phase 1: Query Alignment
phase1:
  name: "query_alignment"
  epochs: 15
  batch_size: 16
  gradient_accumulation_steps: 2
  effective_batch_size: 32
  
  # Frozen modules
  freeze:
    - "vision_encoder"
    - "text_decoder"
  
  # Trainable modules
  trainable:
    - "condition_queries"
    - "anatomical_queries"
    - "cross_attention"
    - "gated_fusion"
    - "condition_to_decoder"
    - "auxiliary_head"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  # Scheduler
  scheduler:
    type: "cosine_with_warmup"
    warmup_steps: 200
    min_lr: 1.0e-6
  
  # Loss weights
  loss:
    generation_weight: 1.0
    auxiliary_weight: 1.0
    label_smoothing: 0.0
    gate_reg_weight: 0.1    # Push gate towards 0.5 to keep condition signals flowing

# Phase 2: End-to-End Fine-tuning
phase2:
  name: "end_to_end"
  epochs: 30
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  
  # Frozen modules
  freeze:
    - "vision_encoder.embeddings"
  
  # LoRA fine-tuning
  lora_modules:
    - "vision_encoder"
    - "text_decoder"
  
  # Trainable modules
  trainable:
    - "condition_queries"
    - "anatomical_queries"
    - "cross_attention"
    - "gated_fusion"
    - "condition_to_decoder"
    - "auxiliary_head"
    - "projection"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  # Scheduler
  scheduler:
    type: "cosine_with_warmup"
    warmup_steps: 500
    min_lr: 1.0e-6
  
  # Loss weights
  loss:
    generation_weight: 1.0
    auxiliary_weight: 0.5
    label_smoothing: 0.05
    gate_reg_weight: 0.1    # Push gate towards 0.5 to keep condition signals flowing

# Phase 3: Generation Fine-tuning
phase3:
  name: "generation_finetuning"
  enabled: true
  epochs: 10
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  
  # Frozen modules — freeze vision encoder and auxiliary head.
  # The condition_to_decoder projection stays trainable so the decoder
  # can refine how it consumes condition information during generation.
  freeze:
    - "vision_encoder"
    - "auxiliary_head"
  
  # Trainable modules
  trainable:
    - "condition_queries"
    - "anatomical_queries"
    - "cross_attention"
    - "gated_fusion"
    - "condition_to_decoder"
    - "text_decoder"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.01
  
  # Scheduler
  scheduler:
    type: "cosine_with_warmup"
    warmup_steps: 200
    min_lr: 1.0e-7
  
  # Loss weights — generation-only; auxiliary is frozen.
  # Gate reg stays at 0.0 because the gate should be well-calibrated
  # by the end of Phase 2.
  loss:
    generation_weight: 1.0
    auxiliary_weight: 0.0
    label_smoothing: 0.1
    gate_reg_weight: 0.0

# Training settings
training:
  precision: "bf16-mixed"
  gradient_clip_val: 1.0
  gradient_checkpointing: true
  num_workers: 2
  pin_memory: true
  # Per-label pos_weight for auxiliary BCE loss.
  # Estimated from inverse class frequency on the balanced MIMIC-CXR
  # subset (~10K studies).  Because the subset is balanced, weights
  # are much less extreme than the IU X-ray set.  Values are capped
  # at 10.0 to prevent gradient instability.
  # These are applied via pos_weight= (NOT weight=) so only the
  # positive-class loss is scaled, correcting for class imbalance.
  auxiliary_label_weights:
    No Finding: 2.0
    Enlarged Cardiomediastinum: 4.0
    Cardiomegaly: 3.0
    Lung Opacity: 3.0
    Lung Lesion: 5.0
    Edema: 3.5
    Consolidation: 4.0
    Pneumonia: 5.0
    Atelectasis: 3.0
    Pneumothorax: 5.0
    Pleural Effusion: 3.0
    Pleural Other: 5.0
    Fracture: 5.0
    Support Devices: 1.5

  # Focal loss configuration for auxiliary classification head.
  # Focal loss down-weights easy (well-classified) examples so training
  # concentrates on hard, misclassified ones -- critical for rare conditions.
  focal_loss:
    enabled: true
    gamma: 2.0        # Focusing parameter (higher = more focus on hard examples)
    alpha: null        # Global alpha balancing (null to disable; pos_weight handles it)
  
  # Checkpointing
  save_every_n_epochs: 1
  save_top_k: 3
  monitor_metric: "val/loss"
  monitor_mode: "min"
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
  
  # Logging
  log_every_n_steps: 10
  use_wandb: false
  wandb_project: "chexquery-medvlm"

